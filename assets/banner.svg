<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.45; }
    }

    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.2; }
      50% { transform: scale(0.9) translate(-25px, 20px); opacity: 0.4; }
    }

    @keyframes radarWave {
      0% { r: 10px; opacity: 0.8; }
      50% { opacity: 0.4; }
      100% { r: 180px; opacity: 0; }
    }

    @keyframes floatPillSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatPillFast {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    @keyframes barGrow {
      0%, 100% { transform: scaleY(0.7); }
      50% { transform: scaleY(1); }
    }

    /* Animation Classes */
    .orb-glow-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-glow-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .radar-circle-1 { animation: radarWave 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
    .radar-circle-2 { animation: radarWave 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 2s; }
    .floating-pill-1 { animation: floatPillSlow 5s ease-in-out infinite; }
    .floating-pill-2 { animation: floatPillFast 6s ease-in-out infinite 1s; }
    .floating-pill-3 { animation: floatPillSlow 5.5s ease-in-out infinite 2s; }
    .dash-line { stroke-dasharray: 6 6; animation: dashCycle 2s linear infinite; }
    .bar-anim-1 { animation: barGrow 3s ease-in-out infinite; transform-origin: bottom; }
    .bar-anim-2 { animation: barGrow 3s ease-in-out infinite 0.6s; transform-origin: bottom; }
    .bar-anim-3 { animation: barGrow 3s ease-in-out infinite 1.2s; transform-origin: bottom; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Background Geometric Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Background Dynamic Glowing Orbs (Behind All Content) -->
  <circle class="orb-glow-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#softGlow)" />
  <circle class="orb-glow-2" cx="1020" cy="240" r="160" fill="#818cf8" filter="url(#softGlow)" />
  <circle cx="900" cy="80" r="100" fill="#c084fc" opacity="0.15" filter="url(#softGlow)" />

  <!-- Dynamic Radar / Search Crawler Waves (Right Background) -->
  <g transform="translate(1040, 180)" opacity="0.45">
    <circle class="radar-circle-1" cx="0" cy="0" r="10" stroke="#38bdf8" stroke-width="2" fill="none" />
    <circle class="radar-circle-2" cx="0" cy="0" r="10" stroke="#818cf8" stroke-width="1.5" fill="none" />
    <!-- Center Scanner Node -->
    <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#glow)" />
    <!-- Dynamic SERP Graph Icon -->
    <path class="dash-line" d="M -90 40 L -45 -10 L 10 20 L 60 -40 L 90 -20" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7" />
  </g>

  <!-- Dynamic Organic Growth Bars (Left Lower Corner Background) -->
  <g transform="translate(50, 270)" opacity="0.35">
    <rect class="bar-anim-1" x="0" y="-30" width="8" height="30" rx="3" fill="#38bdf8" />
    <rect class="bar-anim-2" x="14" y="-55" width="8" height="55" rx="3" fill="#818cf8" />
    <rect class="bar-anim-3" x="28" y="-80" width="8" height="80" rx="3" fill="#c084fc" />
    <rect class="bar-anim-1" x="42" y="-60" width="8" height="60" rx="3" fill="#38bdf8" />
    <rect class="bar-anim-2" x="56" y="-95" width="8" height="95" rx="3" fill="#22d3ee" />
  </g>

  <!-- Foreground Content Block (High Contrast, Guaranteed Unobscured) -->

  <!-- Top Category Tag -->
  <g transform="translate(90, 68)">
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="5" fill="#22d3ee" filter="url(#glow)" />
    <text x="32" y="20" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="152" fill="url(#primaryGrad)" font-size="44" font-weight="800" letter-spacing="-1.2">
    Awesome SEO &amp; AI Search
  </text>

  <!-- Subtitle -->
  <text x="90" y="196" fill="#e2e8f0" font-size="20" font-weight="500" letter-spacing="-0.2">
    Search Engine Optimization • GEO / AEO • Technical Crawlers • SERP Trackers
  </text>

  <!-- Secondary Descriptive Line -->
  <text x="90" y="232" fill="#94a3b8" font-size="14.5" font-weight="400">
    Top enterprise SaaS suites, bootstrapped leaders &amp; high-performance open-source tools.
  </text>

  <!-- Dynamic Feature Badges / Pills (Lower Foreground) -->
  <g transform="translate(90, 272)">
    <!-- Pill 1: Technical Audits -->
    <g class="floating-pill-1">
      <rect width="180" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="24" fill="#38bdf8" font-size="13" font-weight="600">⚡ Technical Audits</text>
    </g>

    <!-- Pill 2: Keyword Discovery -->
    <g class="floating-pill-2" transform="translate(196, 0)">
      <rect width="195" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="24" fill="#a5b4fc" font-size="13" font-weight="600">🔍 Keyword Discovery</text>
    </g>

    <!-- Pill 3: GEO & AI Overviews -->
    <g class="floating-pill-3" transform="translate(407, 0)">
      <rect width="215" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="24" fill="#e879f9" font-size="13" font-weight="600">🤖 GEO &amp; AI Visibility</text>
    </g>

    <!-- Pill 4: Rank Tracking -->
    <g class="floating-pill-1" transform="translate(638, 0)">
      <rect width="165" height="38" rx="19" fill="url(#badgeGrad1)" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="22" y="24" fill="#67e8f9" font-size="13" font-weight="600">📈 Rank Tracking</text>
    </g>
  </g>

  <!-- Subtle Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="11" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
</svg>
